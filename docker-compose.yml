name: sarafan-core

services:
  api:
    build:
      context: .
      dockerfile: src/Sarafan.Core/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/status/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  tests:
    build:
      context: .
      dockerfile: src/Sarafan.Core/Dockerfile
      target: test
      args:
        BUILD_CONFIGURATION: Release
    profiles:
      - test
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    volumes:
      - ./TestResults:/test-results
    command:
      - dotnet
      - test
      - ./tests/Sarafan.Core.Tests/Sarafan.Core.Tests.csproj
      - --configuration
      - Release
      - --no-build
      - --no-restore
      - --verbosity
      - normal
      - --logger
      - "trx;LogFileName=sarafan-core-tests.trx"
      - --collect
      - "XPlat Code Coverage"
      - --results-directory
      - /test-results
