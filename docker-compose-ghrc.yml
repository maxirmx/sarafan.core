name: sarafan

services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: ${SARAFAN_POSTGRES_DB:-sarafan}
      POSTGRES_USER: ${SARAFAN_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${SARAFAN_POSTGRES_PASSWORD:?Set SARAFAN_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SARAFAN_POSTGRES_USER:-postgres} -d ${SARAFAN_POSTGRES_DB:-sarafan}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - type: bind
        source: ${SARAFAN_POSTGRES_DATA_DIR:?Set SARAFAN_POSTGRES_DATA_DIR}
        target: /var/lib/postgresql/data

  backup:
    image: ghcr.io/sw-consulting/db-backup:latest
    restart: always
    init: true
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${SARAFAN_POSTGRES_DB:-sarafan}
      DB_USER: ${SARAFAN_POSTGRES_USER:-postgres}
      DB_PASSWORD: ${SARAFAN_POSTGRES_PASSWORD:?Set SARAFAN_POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      RETENTION_DAYS: ${SARAFAN_BACKUP_RETENTION_DAYS:-7}
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 1h
      start_period: 5s
    volumes:
      - type: bind
        source: ${SARAFAN_BACKUP_DATA_DIR:?Set SARAFAN_BACKUP_DATA_DIR}
        target: /backups
      - type: bind
        source: ${SARAFAN_BACKUP_LOG_DIR:?Set SARAFAN_BACKUP_LOG_DIR}
        target: /var/log
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ghcr.io/maxirmx/sarafan.core:${SARAFAN_CORE_IMAGE_TAG:-latest}
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${SARAFAN_POSTGRES_DB:-sarafan};Username=${SARAFAN_POSTGRES_USER:-postgres};Password=${SARAFAN_POSTGRES_PASSWORD:?Set SARAFAN_POSTGRES_PASSWORD}
      Authentication__SigningKey: ${SARAFAN_JWT_SECRET:?Set SARAFAN_JWT_SECRET}
      Authentication__AllowFixedCode: "false"
      Authentication__SecureCookies: "true"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/status/status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      default:
        aliases:
          - api

  ui:
    image: ghcr.io/maxirmx/sarafan.ui:${SARAFAN_UI_IMAGE_TAG:-latest}
    restart: always
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      default:
        aliases:
          - ui
